<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ダッシュボード</title>
  <style>
    body { font-family: sans-serif; background: #f7fafc; padding: 40px; color: #2d3748; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { margin-bottom: 20px; color: #4a5568; }
    button { padding: 8px 16px; background: #e53e3e; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #c53030; }
  </style>
</head>
<body>
  <div class="card">
    <h1>管理者ダッシュボード</h1>
    <p>ログインに成功しました。ここは認証済みユーザーのみ閲覧できます。</p>
    <form action="/admin/logout" method="POST">
      <button type="submit">ログアウト</button>
    </form>
  </div>
</body>
</html>
